name: Validate and deploy static Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/*.test.mjs
      - run: node scripts/check-boundaries.mjs
      - name: Package only public application files
        run: |
          mkdir -p public-site/docs
          cp index.html update.html styles.css manifest.webmanifest sw.js public-site/
          cp -r src icons public-site/
          cp docs/start.html docs/setup.md docs/verification.md public-site/docs/
          touch public-site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
