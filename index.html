<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#203f32" />
    <meta
      name="description"
      content="私人訓練與身體組成紀錄。手機記錄，離線保存，同步至自己的 Google 試算表。"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="google-oauth-client-id"
      content="247259748020-l7sk8tvdk3m9k4jn37bag1bfq0o2npvm.apps.googleusercontent.com"
    />
    <title>練習誌 · 個人訓練紀錄</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./src/ui/theme.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./src/ui/body-map.css" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#dashboard">跳至訓練概覽</a>
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">練</span>
        <div>
          <h1>練習誌</h1>
          <p>每一次，都留下紀錄。</p>
        </div>
      </div>
      <button id="settings" type="button" class="quiet" data-startup disabled>
        資料設定
      </button>
    </header>
    <main>
      <nav class="dashboard-nav" aria-label="訓練概覽導覽">
        <a href="#entry">記錄</a><a href="#training-day">當日</a><a href="#movement">人體圖</a><a href="#progress">進展</a><a href="#composition">InBody</a>
      </nav>
      <section id="entry" class="workspace" aria-label="記錄訓練">
        <div class="sync-line">
          <span id="sync-status" role="status">正在開啟手機資料…</span
          ><button id="sync" type="button" class="quiet" data-startup disabled>
            同步
          </button>
        </div>
        <div class="quick-entry-heading">
          <h2>快速記錄</h2>
          <p>選擇器材，只填這次實際完成的次數。</p>
        </div>
        <div id="equipment-shortcuts" class="equipment-shortcuts"></div>
        <div class="entry-actions">
          <button
            id="record"
            type="button"
            class="primary"
            data-startup
            disabled
          >
            <span aria-hidden="true">＋</span> 其他器材</button
          ><button
            id="inbody"
            type="button"
            class="secondary"
            data-startup
            disabled
          >
            記錄 InBody
          </button>
        </div>
        <p id="notice" role="status" aria-live="polite"></p>
        <div class="range-bar">
          <label for="range">訓練檢視範圍</label
          ><select id="range">
            <option value="30">最近 30 天</option>
            <option value="56">最近 8 週</option>
            <option value="0">全部紀錄</option></select
          ><button id="install" type="button" class="quiet" hidden>
            加入主畫面
          </button>
        </div>
      </section>
      <section id="training-day" class="training-day" aria-label="當日紀錄與部位摘要"></section>
      <div id="dashboard"></div>
      <section id="history" class="history" aria-label="紀錄清單"></section>
    </main>
    <footer>
      <p>你的資料，留在你的手機與私人試算表。</p>
      <p id="last-sync"></p>
      <p><a href="./update.html">檢查並更新程式</a></p>
    </footer>
    <noscript>此程式需要 JavaScript 才能在手機保存與分析紀錄。</noscript>
  </body>
</html>
